<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subnets calculator</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        margin: 0;
        padding: 20px;
        background-color: #f4f7f9;
        display: flex;
        justify-content: center;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 95%;
        max-width: 1800px;
      }
      .toolbar {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 25px;
        padding-bottom: 20px;
        border-bottom: 2px solid #eee;
      }
      .input-group {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      input[type="text"],
      select {
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        font-family: monospace;
      }
      input[type="text"] {
        flex: 2;
      }
      select {
        flex: 1;
        background-color: #fff;
        cursor: pointer;
      }

      button {
        padding: 10px 25px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        white-space: nowrap;
      }
      button:hover {
        background-color: #2980b9;
      }
      button.btn-reset {
        background-color: #e74c3c;
      }

      /* Filtres de masques */
      .filter-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        font-size: 0.9em;
        background: #fff;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #eee;
      }
      .filter-item {
        display: flex;
        align-items: center;
        gap: 5px;
        background: #ececec;
        padding: 4px 8px;
        border-radius: 3px;
        cursor: pointer;
      }

      .mask-block {
        margin-bottom: 25px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        overflow: hidden;
      }
      .mask-block.hidden {
        display: none;
      }

      .mask-header {
        background: #f8f9fa;
        padding: 10px 20px;
        font-weight: bold;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
      }
      .mask-info {
        font-weight: normal;
        font-size: 0.85em;
        color: #666;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 8px;
        padding: 20px;
      }
      .network-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: monospace;
        font-size: 0.9em;
        padding: 8px;
        background: #ffffff;
        border-radius: 4px;
        border: 1px solid #dee2e6;
        color: #212529;
      }
      .network-item.master-checked {
        border: 2px solid #000;
        font-weight: bold;
      }
      .network-item.inherited {
        border: 1px dashed rgba(0, 0, 0, 0.3);
        opacity: 0.8;
      }
      .error {
        color: #e74c3c;
        margin-bottom: 15px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="toolbar">
        <div class="input-group">
          <select id="savedNetworks" onchange="loadFromHistory(this.value)">
            <option value="">-- Réseaux mémorisés --</option>
          </select>
          <input
            type="text"
            id="networkInput"
            placeholder="Ex: 10.105.196.0/22"
          />
          <button onclick="decompose()">Décomposer</button>
          <button onclick="clearCurrentInventory()" class="btn-reset">
            Reset ce réseau
          </button>
        </div>

        <div id="filterContainer" class="filter-group">
          <strong>Afficher les masques :</strong>
        </div>
      </div>

      <div id="errorLog" class="error"></div>
      <div id="results"></div>
    </div>

    <script>
      // Helpers IP
      function ipToInt(ip) {
        return (
          ip
            .split(".")
            .reduce((res, octet) => (res << 8) + parseInt(octet, 10), 0) >>> 0
        );
      }
      function intToIp(int) {
        return [
          (int >>> 24) & 0xff,
          (int >>> 16) & 0xff,
          (int >>> 8) & 0xff,
          int & 0xff,
        ].join(".");
      }
      function getDistinctColor(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++)
          hash = str.charCodeAt(i) + ((hash << 5) - hash);
        return `hsl(${Math.abs(hash * 137.5) % 360}, 85%, 85%)`;
      }

      function getParentCIDRs(ipInt, currentMask, baseMask) {
        const parents = [];
        for (let m = currentMask - 1; m >= baseMask; m--) {
          const parentNet = (ipInt & (0xffffffff << (32 - m))) >>> 0;
          parents.push(`${intToIp(parentNet)}/${m}`);
        }
        return parents;
      }

      // --- Gestion de l'historique ---
      function refreshHistoryDropdown() {
        const select = document.getElementById("savedNetworks");
        select.innerHTML = '<option value="">-- Réseaux mémorisés --</option>';
        Object.keys(localStorage).forEach((key) => {
          if (key.startsWith("inventory_")) {
            const net = key.replace("inventory_", "");
            const opt = document.createElement("option");
            opt.value = net;
            opt.textContent = net;
            select.appendChild(opt);
          }
        });
      }

      function loadFromHistory(val) {
        if (!val) return;
        document.getElementById("networkInput").value = val;
        decompose();
      }

      // --- Logique de stockage ---
      function getStorageKey() {
        const input = document.getElementById("networkInput").value.trim();
        return input ? `inventory_${input}` : null;
      }

      function getSavedData() {
        const key = getStorageKey();
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : {};
      }

      function saveData(data) {
        const key = getStorageKey();
        if (key) {
          localStorage.setItem(key, JSON.stringify(data));
          refreshHistoryDropdown();
        }
      }

      function toggleInventory(checkbox) {
        const netId = checkbox.dataset.id;
        let data = getSavedData();
        if (checkbox.checked) {
          data[netId] = "taken";
        } else {
          delete data[netId];
        }
        saveData(data);
        updateUI();
      }

      function clearCurrentInventory() {
        const key = getStorageKey();
        if (key && confirm(`Effacer l'inventaire pour ${key} ?`)) {
          localStorage.removeItem(key);
          refreshHistoryDropdown();
          decompose();
        }
      }

      function updateUI() {
        document.querySelectorAll(".network-item").forEach((el) => {
          el.style.backgroundColor = "";
          el.classList.remove("inherited", "master-checked");
          const cb = el.querySelector("input");
          if (cb) cb.checked = false;
        });

        const data = getSavedData();
        const sortedKeys = Object.keys(data).sort(
          (a, b) => parseInt(a.split("/")[1]) - parseInt(b.split("/")[1]),
        );

        sortedKeys.forEach((netKey) => {
          if (data[netKey] === "taken") {
            const color = getDistinctColor(netKey);
            const master = document.querySelector(`[data-own-id="${netKey}"]`);
            if (master) {
              master.classList.add("master-checked");
              master.style.backgroundColor = color;
              master.querySelector("input").checked = true;
            }
            const children = document.querySelectorAll(
              `[data-parents*="|${netKey}|"]`,
            );
            children.forEach((child) => {
              child.classList.add("inherited");
              child.style.backgroundColor = color;
            });
          }
        });
      }

      // --- Filtres de visibilité ---
      function toggleMaskVisibility(mask, isVisible) {
        const block = document.getElementById(`block-mask-${mask}`);
        if (block) {
          if (isVisible) block.classList.remove("hidden");
          else block.classList.add("hidden");
        }
      }

      function generateFilterCheckboxes(start, end) {
        const container = document.getElementById("filterContainer");
        // On vide sauf le label "Afficher les masques"
        container.innerHTML = "<strong>Afficher les masques :</strong>";

        for (let m = start; m <= end; m++) {
          const label = document.createElement("label");
          label.className = "filter-item";
          label.innerHTML = `<input type="checkbox" checked onchange="toggleMaskVisibility(${m}, this.checked)"> /${m}`;
          container.appendChild(label);
        }
      }

      function decompose() {
        const input = document.getElementById("networkInput").value.trim();
        const resultsDiv = document.getElementById("results");
        const errorDiv = document.getElementById("errorLog");

        if (!input) return;
        localStorage.setItem("last_active_network", input);

        const parts = input.split("/");
        if (parts.length !== 2) {
          errorDiv.textContent = "Format invalide.";
          return;
        }

        resultsDiv.innerHTML = "";
        errorDiv.textContent = "";

        const baseMask = parseInt(parts[1]);
        const baseInt = ipToInt(parts[0]);
        const networkStart = (baseInt & (0xffffffff << (32 - baseMask))) >>> 0;
        const totalIPs = Math.pow(2, 32 - baseMask);

        // Générer les filtres pour les masques cibles
        generateFilterCheckboxes(baseMask + 1, 30);

        for (let targetMask = baseMask + 1; targetMask <= 30; targetMask++) {
          const subnetSize = Math.pow(2, 32 - targetMask);
          const count = totalIPs / subnetSize;
          if (count > 1024) continue;

          const block = document.createElement("div");
          block.className = "mask-block";
          block.id = `block-mask-${targetMask}`;
          block.innerHTML = `<div class="mask-header">Masque /${targetMask} <span class="mask-info">${count} sous-réseaux</span></div>`;

          const grid = document.createElement("div");
          grid.className = "grid";

          for (let i = 0; i < count; i++) {
            const currentNetInt = networkStart + i * subnetSize;
            const netStr = `${intToIp(currentNetInt)}/${targetMask}`;
            const parents = getParentCIDRs(currentNetInt, targetMask, baseMask);

            const label = document.createElement("label");
            label.className = "network-item";
            label.setAttribute("data-own-id", netStr);
            label.setAttribute("data-parents", `|${parents.join("|")}|`);
            label.innerHTML = `
              <input type="checkbox" data-id="${netStr}" onchange="toggleInventory(this)">
              <span>${netStr}</span>
            `;
            grid.appendChild(label);
          }
          block.appendChild(grid);
          resultsDiv.appendChild(block);
        }
        updateUI();
      }

      window.onload = () => {
        refreshHistoryDropdown();
        const last = localStorage.getItem("last_active_network");
        if (last) {
          document.getElementById("networkInput").value = last;
          document.getElementById("savedNetworks").value = last;
          decompose();
        }
      };
    </script>
  </body>
</html>
