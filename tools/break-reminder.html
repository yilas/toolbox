<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rappel de pause — Toolbox</title>
  <link rel="stylesheet" href="../assets/css/toolbox-shared.css">
  <style>
    body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    button,input { font:inherit; } button { cursor:pointer; } button:disabled { opacity:.45; cursor:not-allowed; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    .shell { max-width:960px; }
    .layout { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:16px; align-items:start; }
    .card { text-align:center; }
    #countdown { font-size:clamp(48px,9vw,80px); font-weight:750; font-variant-numeric:tabular-nums; letter-spacing:-.04em; color:var(--accent); line-height:1.2; }
    #status-line { color:var(--muted); min-height:24px; margin:6px 0 22px; }
    .btn-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .btn,#standup-btn { background:var(--accent); color:#fff; border:1px solid transparent; border-radius:10px; padding:10px 14px; font-weight:650; }
    html[data-theme=dark] .btn:not(.secondary),html[data-theme=dark] #standup-btn { color:#0b1120; }
    .btn.secondary { background:var(--soft); color:var(--text); border-color:var(--border); }
    .settings { display:grid; gap:0; }
    .setting-line { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 0; border-bottom:1px solid var(--border); }
    .setting-line:last-of-type { border-bottom:0; }
    .setting-line input[type=number] { width:80px; background:var(--soft); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px; }
    .switch { display:inline-flex; align-items:center; }
    .switch input { width:22px; height:22px; accent-color:var(--accent); cursor:pointer; }
    .slider { display:none; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:24px 0 0; }
    .stat-box { background:var(--soft); border:1px solid var(--border); border-radius:12px; padding:12px; }
    .num { font-size:26px; font-weight:750; font-variant-numeric:tabular-nums; }
    .lbl,.hint { color:var(--muted); font-size:12px; }
    #overlay { position:fixed; inset:0; background:rgba(10,20,40,.78); display:none; align-items:center; justify-content:center; z-index:9999; padding:20px; }
    #overlay .panel { max-width:440px; width:100%; text-align:center; }
    #overlay h1 { font-size:26px; margin:0 0 10px; } #overlay p { color:var(--muted); }
    #standup-btn { width:100%; }
    @media(max-width:680px) { .layout { grid-template-columns:1fr; } .nav { padding:16px; flex-wrap:wrap; } .nav strong { order:-1; width:100%; } .panel { padding:20px; } }
  </style>
<script src="../assets/js/theme.js" defer></script></head>
<body>
  <header class="nav"><a href="../index.html" aria-label="Retour à Toolbox">← Retour à Toolbox</a><strong><span class="mark" aria-hidden="true">◷</span> Rappel de pause</strong><button type="button" id="theme" aria-label="Changer le thème" title="Changer le thème">☾</button></header>

  <main class="shell">
    <div class="hero"><h1>Rappel de pause</h1></div>
    <div class="layout"><section class="panel card" aria-label="Minuteur">
      <!-- Décompte principal -->
      <div id="countdown">60:00</div>
      <div id="status-line">Prêt</div>

      <!-- Contrôles -->
      <div class="btn-row">
        <button class="btn" id="start-btn">Démarrer</button>
        <button class="btn secondary" id="pause-btn" disabled>Pause</button>
        <button class="btn secondary" id="reset-btn">Réinitialiser</button>
      </div>

      <div class="stats"><div class="stat-box"><div class="num" id="streak-val">0</div><div class="lbl">Série</div></div><div class="stat-box"><div class="num" id="total-val">0</div><div class="lbl">Total pauses</div></div></div>
      </section><section class="panel" aria-labelledby="settings-title"><h2 id="settings-title">Réglages</h2>
      <!-- Réglages -->
      <div class="settings">
        <div class="setting-line">
          <label for="minutes-input">Intervalle (minutes)</label>
          <input type="number" id="minutes-input" min="1" max="240" value="60">
        </div>
        <div class="setting-line">
          <label for="hardcore-toggle">Confirmation obligatoire</label>
          <label class="switch">
            <input type="checkbox" id="hardcore-toggle" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-line">
          <label for="alert-toggle">Notifications, son et titre clignotant</label>
          <label class="switch">
            <input type="checkbox" id="alert-toggle" checked>
            <span class="slider"></span>
          </label>
        </div>
        <p class="hint">Les notifications nécessitent l’autorisation du navigateur.</p>
      </div>
    </section></div>
  </main>

  <!-- ======================= OVERLAY HARDCORE ======================= -->
  <div id="overlay">
    <div class="panel">
      <h1 id="overlay-title">C’est l’heure de la pause !</h1>
      <button id="standup-btn">Je suis debout</button>
    </div>
  </div>

  <script>
  /* =====================================================================
     BREAK REMINDER — logique complète (Vanilla JS, zéro dépendance)
     ===================================================================== */

  // ---- Clés LocalStorage (préfixe pour éviter les collisions dans le portail)
  const LS_STREAK   = 'breakReminder.streak';
  const LS_TOTAL    = 'breakReminder.total';
  const LS_MINUTES  = 'breakReminder.minutes';
  const LS_HARDCORE = 'breakReminder.hardcore';
  const LS_ALERTS   = 'breakReminder.alerts';

  // ---- Banque de messages piquants (aléatoires)
  const TAUNTS = ["C’est l’heure de la pause !"];

  // ---- Récupération des éléments du DOM
  const el = {
    countdown:   document.getElementById('countdown'),
    status:      document.getElementById('status-line'),
    streak:      document.getElementById('streak-val'),
    total:       document.getElementById('total-val'),
    start:       document.getElementById('start-btn'),
    pause:       document.getElementById('pause-btn'),
    reset:       document.getElementById('reset-btn'),
    minutes:     document.getElementById('minutes-input'),
    hardcore:    document.getElementById('hardcore-toggle'),
    alerts:      document.getElementById('alert-toggle'),
    overlay:     document.getElementById('overlay'),
    overlayTitle:document.getElementById('overlay-title'),
    standup:     document.getElementById('standup-btn'),
  };

  // ---- État applicatif
  let remaining   = 0;        // secondes restantes avant la pause
  let mainTimer   = null;     // handle setInterval du décompte principal
  let running     = false;
  let titleFlash  = null;     // handle du clignotement du titre d'onglet
  const BASE_TITLE = document.title;

  /* ---------------------------------------------------------------
     Utilitaires
  --------------------------------------------------------------- */
  const fmt = (totalSec) => {
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  };
  const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // Durée configurée (minutes de l'input)
  function configuredSeconds() {
    const min = Math.max(1, parseInt(el.minutes.value, 10) || 60);
    return min * 60;
  }

  /* ---------------------------------------------------------------
     Alertes hors navigateur : son + notif système + titre clignotant
  --------------------------------------------------------------- */
  // Bip sonore généré à la volée (aucun fichier audio nécessaire)
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'square';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      // 3 bips courts
      [0, 0.25, 0.5].forEach(t => {
        gain.gain.setValueAtTime(0.15, ctx.currentTime + t);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime + t + 0.15);
      });
      osc.start();
      osc.stop(ctx.currentTime + 0.7);
    } catch (e) { /* audio indisponible : on ignore */ }
  }

  // Fait clignoter le titre de l'onglet pour attirer l'œil dans la barre des tâches
  function startTitleFlash(msg) {
    stopTitleFlash();
    let on = false;
    titleFlash = setInterval(() => {
      document.title = on ? BASE_TITLE : msg;
      on = !on;
    }, 800);
  }
  function stopTitleFlash() {
    clearInterval(titleFlash);
    titleFlash = null;
    document.title = BASE_TITLE;
  }

  // Notification système (cliquable pour revenir sur la fenêtre)
  function fireNotification(title) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const n = new Notification(title, {
      body: 'Clique ici pour revenir et valider ta pause.',
      requireInteraction: true   // reste affichée jusqu'à interaction
    });
    n.onclick = () => { window.focus(); n.close(); };
  }

  // Déclenche toutes les alertes activées
  function fireAlerts(msg) {
    if (!el.alerts.checked) return;
    playBeep();
    fireNotification(msg);
    startTitleFlash('🚨 PAUSE !');
  }

  /* ---------------------------------------------------------------
     Persistance (LocalStorage)
  --------------------------------------------------------------- */
  function loadState() {
    el.streak.textContent = localStorage.getItem(LS_STREAK) || 0;
    el.total.textContent  = localStorage.getItem(LS_TOTAL)  || 0;

    const savedMin = localStorage.getItem(LS_MINUTES);
    if (savedMin) el.minutes.value = savedMin;

    const savedHardcore = localStorage.getItem(LS_HARDCORE);
    if (savedHardcore !== null) el.hardcore.checked = savedHardcore === 'true';

    const savedAlerts = localStorage.getItem(LS_ALERTS);
    if (savedAlerts !== null) el.alerts.checked = savedAlerts === 'true';
  }

  function saveSettings() {
    localStorage.setItem(LS_MINUTES, el.minutes.value);
    localStorage.setItem(LS_HARDCORE, el.hardcore.checked);
    localStorage.setItem(LS_ALERTS, el.alerts.checked);
  }

  // Valide une pause : +1 au streak et au total
  function validateBreak() {
    const streak = (parseInt(localStorage.getItem(LS_STREAK), 10) || 0) + 1;
    const total  = (parseInt(localStorage.getItem(LS_TOTAL), 10)  || 0) + 1;
    localStorage.setItem(LS_STREAK, streak);
    localStorage.setItem(LS_TOTAL, total);
    el.streak.textContent = streak;
    el.total.textContent  = total;
  }

  /* ---------------------------------------------------------------
     Décompte principal
  --------------------------------------------------------------- */
  function tick() {
    remaining--;
    el.countdown.textContent = fmt(Math.max(0, remaining));
    if (remaining <= 0) {
      stopMainTimer();
      triggerBreak();
    }
  }

  function startTimer() {
    if (running) return;
    remaining = (remaining > 0 && el.countdown.textContent !== '00:00')
      ? remaining          // reprise après pause
      : configuredSeconds(); // nouveau cycle
    running = true;
    el.countdown.textContent = fmt(remaining);
    el.status.textContent = 'En cours';
    el.start.disabled = true;
    el.pause.disabled = false;
    mainTimer = setInterval(tick, 1000);
  }

  function pauseTimer() {
    stopMainTimer();
    el.status.textContent = 'En pause';
  }

  function stopMainTimer() {
    clearInterval(mainTimer);
    mainTimer = null;
    running = false;
    el.start.disabled = false;
    el.pause.disabled = true;
  }

  function resetTimer() {
    stopMainTimer();
    remaining = configuredSeconds();
    el.countdown.textContent = fmt(remaining);
    el.status.textContent = 'Prêt';
  }

  /* ---------------------------------------------------------------
     Déclenchement de la pause (overlay + alertes)
  --------------------------------------------------------------- */
  function triggerBreak() {
    const taunt = rand(TAUNTS);
    fireAlerts(taunt);   // son + notif + titre clignotant (si activés)

    if (!el.hardcore.checked) {
      // Mode doux : on valide direct et on relance un cycle
      validateBreak();
      el.status.textContent = 'Nouveau cycle.';
      remaining = configuredSeconds();
      startTimer();
      return;
    }

    // ----- Mode Hardcore : overlay bloquant -----
    el.overlayTitle.textContent = taunt;
    el.overlay.style.display = 'flex';
  }

  // Clic sur « Je suis debout » : on valide, on ferme, on relance
  function confirmStandUp() {
    stopTitleFlash();
    el.overlay.style.display = 'none';
    validateBreak();
    el.status.textContent = 'Pause validée.';
    remaining = configuredSeconds();
    startTimer();
  }

  /* ---------------------------------------------------------------
     Câblage des événements
  --------------------------------------------------------------- */
  el.start.addEventListener('click', startTimer);
  el.pause.addEventListener('click', pauseTimer);
  el.reset.addEventListener('click', resetTimer);
  el.standup.addEventListener('click', confirmStandUp);

  el.minutes.addEventListener('change', () => { saveSettings(); if (!running) resetTimer(); });
  el.hardcore.addEventListener('change', saveSettings);
  el.alerts.addEventListener('change', () => {
    saveSettings();
    // Demande l'autorisation de notifs dès qu'on active les alertes
    if (el.alerts.checked && 'Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  });

  // Quand l'utilisateur revient sur l'onglet, on arrête le clignotement du titre
  window.addEventListener('focus', stopTitleFlash);

  // Demande (non bloquante) l'autorisation de notifications au chargement
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  /* ---------------------------------------------------------------
     Initialisation
  --------------------------------------------------------------- */
  loadState();
  resetTimer();
  </script>
</body>
</html>
