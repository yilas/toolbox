<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fc"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Cron Builder — Toolbox</title><link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="dev-time-tools.css"><script src="../assets/js/theme.js" defer></script><script src="cron-builder-core.js" defer></script><script src="cron-builder-ui.js" defer></script></head><body><main><nav class="toolbox-return-nav"><a href="../index.html" aria-label="Retour à Toolbox">← Retour à Toolbox</a><button id="theme" type="button" aria-label="Changer le thème">☾</button></nav><h1>Cron Builder</h1><p>Cron Unix à cinq champs · calcul des prochaines exécutions en UTC.</p><section><label for="expression">Expression cron</label><input id="expression" value="*/15 * * * *" spellcheck="false"><div class="fields"><label>Minute<input id="field0" value="*/15"></label><label>Heure<input id="field1" value="*"></label><label>Jour du mois<input id="field2" value="*"></label><label>Mois<input id="field3" value="*"></label><label>Jour de semaine<input id="field4" value="*"></label></div><label for="preset">Exemples</label><select id="preset"><option value="">Choisir…</option><option value="*/5 * * * *">Toutes les 5 minutes</option><option value="0 8 * * 1-5">En semaine à 08:00 UTC</option><option value="0 0 * * *">Chaque jour à minuit UTC</option><option value="0 0 1 * *">Premier du mois</option></select><label for="start">Date de départ UTC</label><input id="start" type="datetime-local"><div class="actions"><button id="run">Calculer</button><button id="copy">Copier l’expression</button></div><p id="status" role="status"></p></section><section><h2>Prochaines exécutions</h2><ol id="output"></ol></section></main></body></html>
