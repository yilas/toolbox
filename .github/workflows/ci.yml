name: Toolbox CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: toolbox-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect browser test changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.detect.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Identify PDF browser test changes
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] ||
             [[ -z "$BASE_SHA" ]] || [[ "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-files"
          python3 - <<'PY'
          import os
          from pathlib import Path

          files = [
              path.decode("utf-8")
              for path in Path(os.environ["RUNNER_TEMP"], "ci-changed-files").read_bytes().split(b"\0")
              if path
          ]
          browser = any(
              path.startswith(("tools/pdf-compressor", "tests/pdf-compressor",
                               "tests/browser/pdf-compressor", "assets/vendor/"))
              or path in ("assets/css/toolbox-shared.css", ".github/workflows/ci.yml")
              for path in files
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"browser={str(browser).lower()}\n")
          print(f"Changed files: {len(files)}; PDF browser tests: {browser}")
          PY

  node-tests:
    name: Node.js unit and repository tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check JavaScript syntax (including inline scripts)
        run: python3 scripts/check-javascript.py
      - name: Run all Node.js tests once
        run: node --test tests/*.test.cjs

  python-tests:
    name: Security collector and snapshot tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate versioned Pages build
        run: |
          python -m unittest discover -s tests -p 'test_build_pages.py'
          python scripts/build-pages.py "$RUNNER_TEMP/toolbox-site"
      - name: Offline collector tests
        run: python -m unittest discover -s tests -p 'test_security_collector.py'
      - name: Validate advisory JSON structure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path("tools/data/security-advisories.json").read_text(encoding="utf-8"))
          assert snapshot["schema_version"] == 1
          assert isinstance(snapshot["alerts"], list)
          assert isinstance(snapshot["sources"], dict)
          PY

  browser-tests:
    name: PDF Chromium regression tests
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/pdf-browser" --ignore-scripts --no-audit --no-fund playwright@1.65.1
          "$RUNNER_TEMP/pdf-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real PDF browser tests
        env:
          PDF_SCREENSHOTS: screenshots
        run: NODE_PATH="$RUNNER_TEMP/pdf-browser/node_modules" node --test tests/browser/pdf-compressor.test.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pdf-compressor-screenshots
          path: screenshots
          if-no-files-found: ignore

  portal-smoke:
    name: Toolbox browser smoke tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/toolbox-browser" --ignore-scripts --no-audit --no-fund playwright@1.65.1
          "$RUNNER_TEMP/toolbox-browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: NODE_PATH="$RUNNER_TEMP/toolbox-browser/node_modules" node --test tests/browser/portal-smoke.test.cjs

  integration-tests:
    name: Microsoft AKS source integration
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Smoke test against current MicrosoftDocs AKS source
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from scripts.collect_security_advisories import aks_advisories
          alerts = aks_advisories(current=datetime.now(timezone.utc))
          assert alerts, "No recent AKS bulletins found in the official MicrosoftDocs source"
          assert all(item["source"] == "aks" and item["url"].startswith("https://learn.microsoft.com/") for item in alerts)
          print("AKS source OK:", len(alerts), "recent bulletins;", alerts[0]["id"])
          PY
