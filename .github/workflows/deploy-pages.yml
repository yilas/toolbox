name: Deploy Toolbox Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - run: python3 scripts/build-pages.py "$RUNNER_TEMP/toolbox-site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/toolbox-site
      - uses: actions/deploy-pages@v5
        id: deployment
