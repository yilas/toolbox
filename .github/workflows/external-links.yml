name: Toolbox external link review
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/build-pages.py "$RUNNER_TEMP/toolbox-site"
      - run: python scripts/check-links.py "$RUNNER_TEMP/toolbox-site" --external
