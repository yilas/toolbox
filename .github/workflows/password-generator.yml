name: Password generator V2 tests

on:
  pull_request:
    paths:
      - 'tools/random-numbers-generator.html'
      - 'tools/password-generator-*.js'
      - 'tools/password-generator.css'
      - 'tools/password-wordlists.js'
      - 'tests/password-generator.test.cjs'
      - '.github/workflows/password-generator.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/random-numbers-generator.html'
      - 'tools/password-generator-*.js'
      - 'tools/password-generator.css'
      - 'tools/password-wordlists.js'
      - 'tests/password-generator.test.cjs'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Node.js tests (no dependencies)
        run: node --test tests/password-generator.test.cjs
