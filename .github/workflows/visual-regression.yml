name: Toolbox visual regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolbox-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned visual test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/visual" --ignore-scripts --no-audit --no-fund playwright@1.65.1 pixelmatch@5.3.0 pngjs@7.0.0
          "$RUNNER_TEMP/visual/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare screenshots
        run: NODE_PATH="$RUNNER_TEMP/visual/node_modules" node head/tests/browser/visual-regression.cjs base head visual-report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-regression-report
          path: visual-report
          retention-days: 7
          if-no-files-found: ignore
